name: Daily AI Brief

on:
  schedule:
    - cron: '30 2 * * *'  # 8:00 AM IST
  workflow_dispatch:

jobs:
  brief:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      # - name: Get one new thing
      #   env:
      #     CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      #   run: |
      #     claude -p "Search for ONE genuinely new thing from the last 24 hours about Anthropic, Claude, or AI broadly. Output exactly: a one-line headline, then 2-3 sentences explaining it, then the source URL. Nothing else. No preamble, no sign-off." \
      #       --allowed-tools WebSearch \
      #       --max-turns 3 \
      #       > brief.txt
      #     cat brief.txt
      - name: Get one new thing
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          echo "Token length: ${#CLAUDE_CODE_OAUTH_TOKEN}"
          echo "Claude version:"
          claude --version
          echo "Help output:"
          claude --help
          echo "---"
          echo "Trying basic run:"
          claude -p "Say hello in 5 words" > brief.txt
          cat brief.txt

      - name: Email it
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "Daily AI Brief — ${{ github.run_id }}"
          to: ${{ secrets.MAIL_TO }}
          from: Claude Bot <${{ secrets.MAIL_USERNAME }}>
          body: file://brief.txt